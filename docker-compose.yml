services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "4321:4321"
    environment:
      - NODE_ENV=development
    command: npm run dev -- --host 0.0.0.0 --force

volumes:
  node_modules:
